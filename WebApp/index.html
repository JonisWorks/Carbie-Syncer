<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-Cylinder Carbie Syncer</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #121212; color: white; margin: 0; padding: 15px; }
        .controls { margin-bottom: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; align-items: center; }
        button, select { padding: 12px; font-size: 16px; border: none; border-radius: 8px; font-weight: bold; }
        select { background-color: #333; color: white; border: 1px solid #555; cursor: pointer; display: none; }
        #connectBtn { background-color: #007bff; color: white; cursor: pointer; }
        #zeroBtn { background-color: #dc3545; color: white; display: none; cursor: pointer; }
        
        .checkbox-container { display: none; align-items: center; background-color: #333; padding: 10px 15px; border-radius: 8px; border: 1px solid #555; cursor: pointer; font-size: 14px;}
        .checkbox-container input { margin-right: 8px; cursor: pointer; width: 16px; height: 16px;}

        .gauge-container { display: flex; justify-content: center; gap: 15px; margin-top: 10px; height: 210px; }
        .gauge { width: 60px; background-color: #333; border-radius: 8px; position: relative; overflow: hidden; border: 2px solid #555; }
        .bar { width: 100%; position: absolute; bottom: 0; background-color: #28a745; transition: height 0.1s linear, background-color 0.2s ease; }
        .reference-line { position: absolute; width: 100%; height: 2px; background-color: rgba(255, 255, 255, 0.4); top: 50%; left: 0; z-index: 10; pointer-events: none;}
        
        .labels { display: flex; justify-content: center; gap: 15px; margin-top: 10px; font-size: 18px; font-weight: bold; }
        .label { width: 60px; text-align: center; }
        .readouts { display: flex; justify-content: center; gap: 15px; margin-top: 5px; font-size: 16px; font-weight: bold; }
        .readout { width: 60px; text-align: center; font-family: monospace; }
        
        #rpmDisplay { font-size: 28px; font-weight: bold; color: #ff9800; margin-top: 15px; margin-bottom: 5px; font-family: monospace; }

        #c1 { color: #00d2ff; } #c2 { color: #ff007b; } #c3 { color: #ffea00; } #c4 { color: #b700ff; } 
        #status { margin-top: 5px; font-size: 14px; color: #aaa; margin-bottom: 10px;}
        
        .graph-container { display: flex; justify-content: center; margin-top: 20px; width: 100%; }
        canvas { background-color: #1e1e1e; border: 2px solid #444; border-radius: 8px; width: 95%; max-width: 500px; height: 180px; }
    </style>
</head>
<body>

    <h2>Carbie Syncer</h2>
    
    <div class="controls">
        <button id="connectBtn">Connect BLE Tool</button>
        <button id="zeroBtn">Zero Sensors</button>
        <select id="sensorProfile" onchange="sendSensorProfile()">
            <option value="FILTER_HEAVY">Heavy Dampening (Stable Average - Default)</option>
            <option value="FILTER_MEDIUM">Medium Dampening (Balanced)</option>
            <option value="FILTER_LIGHT">Light Dampening (Fast/Sensitive)</option>
            <option value="FILTER_MAX">Max Dampening (For erratic signals)</option>
        </select>
        <label class="checkbox-container" id="peakContainer">
            <input type="checkbox" id="peakToggle" onchange="togglePeakMode()"> Only Intake Strokes
        </label>
    </div>
    <div id="status">Status: Disconnected</div>

    <div id="rpmDisplay">RPM: 0</div>

    <div class="gauge-container">
        <div class="gauge"><div class="reference-line"></div><div class="bar" id="bar1" style="height: 50%;"></div></div>
        <div class="gauge"><div class="reference-line"></div><div class="bar" id="bar2" style="height: 50%;"></div></div>
        <div class="gauge"><div class="reference-line"></div><div class="bar" id="bar3" style="height: 50%;"></div></div>
        <div class="gauge"><div class="reference-line"></div><div class="bar" id="bar4" style="height: 50%;"></div></div>
    </div>
    
    <div class="labels">
        <div class="label" id="c1">Cyl 1</div>
        <div class="label" id="c2">Cyl 2</div>
        <div class="label" id="c3">Cyl 3</div>
        <div class="label" id="c4">Cyl 4</div>
    </div>

    <div class="readouts">
        <div class="readout" id="val1">0.0</div>
        <div class="readout" id="val2">0.0</div>
        <div class="readout" id="val3">0.0</div>
        <div class="readout" id="val4">0.0</div>
    </div>

    <div class="graph-container">
        <canvas id="historyGraph" width="500" height="180"></canvas>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const zeroBtn = document.getElementById('zeroBtn');
        const profileSelect = document.getElementById('sensorProfile');
        const peakContainer = document.getElementById('peakContainer');
        const peakToggle = document.getElementById('peakToggle');
        const statusText = document.getElementById('status');
        const rpmText = document.getElementById('rpmDisplay');
        
        const bars = [
            document.getElementById('bar1'), document.getElementById('bar2'),
            document.getElementById('bar3'), document.getElementById('bar4')
        ];
        const vals = [
            document.getElementById('val1'), document.getElementById('val2'),
            document.getElementById('val3'), document.getElementById('val4')
        ];

        const canvas = document.getElementById('historyGraph');
        const ctx = canvas.getContext('2d');
        const graphColors = ["#00d2ff", "#ff007b", "#ffea00", "#b700ff"]; 
        
        const maxHistory = 100;
        let dataHistory = [[], [], [], []];

        const serviceUuid = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const characteristicUuid = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        let myCharacteristic;

        const calibrationMultiplier = 0.15; 
        const greenThreshold = 3.0;  
        const yellowThreshold = 8.0; 

        connectBtn.addEventListener('click', async () => {
            try {
                statusText.innerText = "Requesting Bluetooth...";
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Carbie_Syncer' }],
                    optionalServices: [serviceUuid]
                });

                statusText.innerText = "Connecting...";
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(serviceUuid);
                myCharacteristic = await service.getCharacteristic(characteristicUuid);

                await myCharacteristic.startNotifications();
                myCharacteristic.addEventListener('characteristicvaluechanged', handleData);
                
                statusText.innerText = "Status: Connected!";
                statusText.style.color = "#28a745";
                connectBtn.style.display = "none";
                
                zeroBtn.style.display = "inline-block";
                profileSelect.style.display = "inline-block";
                peakContainer.style.display = "flex";

            } catch (error) {
                console.log(error);
                statusText.innerText = "Connection failed: " + error;
            }
        });

        zeroBtn.addEventListener('click', async () => {
            if (myCharacteristic) {
                const encoder = new TextEncoder();
                await myCharacteristic.writeValue(encoder.encode("ZERO"));
                dataHistory = [[], [], [], []]; 
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });

        async function sendSensorProfile() {
            if (myCharacteristic) {
                let selectedProfile = profileSelect.value;
                const encoder = new TextEncoder();
                await myCharacteristic.writeValue(encoder.encode(selectedProfile));
            }
        }

        async function togglePeakMode() {
            if (myCharacteristic) {
                const encoder = new TextEncoder();
                let command = peakToggle.checked ? "PEAK_ON" : "PEAK_OFF";
                await myCharacteristic.writeValue(encoder.encode(command));
            }
        }

        function handleData(event) {
            const value = new TextDecoder().decode(event.target.value);
            const data = value.split(',');
            
            if(data.length === 5) {
                let currentRPM = parseInt(data[4]);
                rpmText.innerText = "RPM: " + currentRPM;

                if (peakToggle.checked) {
                    if (currentRPM === 0) {
                        statusText.innerText = "PEAK MODE IDLE: Waiting for engine pulse...";
                        statusText.style.color = "#ffc107"; 
                    } else {
                        statusText.innerText = "PEAK MODE: Locked on intake strokes";
                        statusText.style.color = "#28a745"; 
                    }
                } else {
                    if (currentRPM > 0) {
                        statusText.innerText = "Status: Engine Running (Averaging Mode)";
                        statusText.style.color = "#28a745";
                    } else {
                        statusText.innerText = "Status: Connected & Ready";
                        statusText.style.color = "#28a745";
                    }
                }

                let scaledValues = [];
                let total = 0;

                for(let i=0; i<4; i++) {
                    let val = Math.abs(parseInt(data[i]) * calibrationMultiplier); 
                    scaledValues.push(val);
                    total += val;
                    
                    dataHistory[i].push(val);
                    if(dataHistory[i].length > maxHistory) {
                        dataHistory[i].shift(); 
                    }
                }

                let average = total / 4.0;

                for(let i=0; i<4; i++) {
                    let currentVal = scaledValues[i];
                    vals[i].innerText = currentVal.toFixed(1);

                    let difference = Math.abs(currentVal - average);

                    if (difference <= greenThreshold) {
                        bars[i].style.backgroundColor = "#28a745"; 
                    } else if (difference <= yellowThreshold) {
                        bars[i].style.backgroundColor = "#ffc107"; 
                    } else {
                        bars[i].style.backgroundColor = "#dc3545"; 
                    }

                    // Bar notch, resting baseline
                    let height = 50 - (parseInt(data[i]) * 0.25); 
                    height = Math.max(0, Math.min(100, height)); 
                    bars[i].style.height = height + "%";
                }
                
                drawGraph();
            }
        }

        function drawGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let highestVal = 10; 
            for(let i=0; i<4; i++) {
                let maxInArray = Math.max(...dataHistory[i]);
                if(maxInArray > highestVal) highestVal = maxInArray;
            }
            highestVal *= 1.2; 

            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';

            for(let i=0; i<4; i++) {
                if(dataHistory[i].length < 2) continue;
                
                ctx.beginPath();
                ctx.strokeStyle = graphColors[i];

                for(let j=0; j<dataHistory[i].length; j++) {
                    let x = (j / (maxHistory - 1)) * canvas.width;
                    let y = canvas.height - ((dataHistory[i][j] / highestVal) * canvas.height);
                    
                    if(j === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.stroke();
            }
        }
    </script>
</body>
</html>
